(async()=>{try{
if(!('serviceWorker' in navigator))throw new Error('unsupported');
const registration=await navigator.serviceWorker.register('./media-sw.js?v=193d4dce65da',{scope:'./',updateViaCache:'none'});
const installing=registration.installing||registration.waiting;

}catch(error){document.querySelector('.ring').hidden=true;document.getElementById('status').textContent=error.message==='unsupported'?'请使用新版 Chrome、Edge 或 Safari 打开作品集。':'暂时无法打开作品集，请检查网络后重试。';document.getElementById('retry').hidden=false;}})();
