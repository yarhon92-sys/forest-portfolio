 function visible(){const r=cover.getBoundingClientRect();return r.top<innerHeight&&r.bottom>0&&!document.hidden&&!section.classList.contains('ip-scattering')&&cover.style.opacity!=='0';}
 function sync(){
   if(!visible()||userPaused){video.pause();label();return;}
   if(!video.paused||pending)return;
   pending=true;
   video.play().catch(()=>{}).finally(()=>{pending=false;if(!visible()||userPaused)video.pause();label();});
 }
 toggle.addEventListener('click',()=>{userPaused=!video.paused;if(!userPaused)video.muted=true;sync();});
 ['play','pause','error'].forEach(event=>video.addEventListener(event,label));
 ['loadeddata','canplay'].forEach(event=>video.addEventListener(event,sync));
 cover.addEventListener('ip-cover-resume',()=>requestAnimationFrame(sync));
 new MutationObserver(sync).observe(section,{attributes:true,attributeFilter:['class']});
 new IntersectionObserver(sync,{threshold:[0,.1,.5,1]}).observe(cover);
 addEventListener('scroll',sync,{passive:true});addEventListener('resize',sync);addEventListener('pageshow',sync);
 document.addEventListener('visibilitychange',sync);
 reduce.addEventListener('change',()=>{userPaused=reduce.matches;sync()});
 label();sync();
})();
</script>
